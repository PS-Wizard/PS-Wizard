name: update-graph
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python gen_contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: PS-Wizard
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: update graph
          file_pattern: github-contrib-animated.svg
